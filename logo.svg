<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Create Cinematic Interactions</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#11151f"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77c"/>
      <stop offset="0.55" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#9a6a1f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f3ff"/>
      <stop offset="1" stop-color="#9fc4ee"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="0.45" stop-color="#1f5fae"/>
      <stop offset="1" stop-color="#0a1b38"/>
    </radialGradient>
  </defs>

  <!-- background (full bleed; CurseForge rounds the corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- viewfinder corners -->
  <path d="M46,104 L46,46 L104,46" fill="none" stroke="url(#frame)" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M466,104 L466,46 L408,46" fill="none" stroke="url(#frame)" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M46,408 L46,466 L104,466" fill="none" stroke="url(#frame)" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M466,408 L466,466 L408,466" fill="none" stroke="url(#frame)" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- brass cog -->
  <path d="M233.9,111.7 L236.7,81.1 L275.3,81.1 L278.1,111.7 L309.0,120.0 L326.7,94.8 L360.2,114.2 L347.3,142.1 L369.9,164.7 L397.8,151.8 L417.2,185.3 L392.0,203.0 L400.3,233.9 L430.9,236.7 L430.9,275.3 L400.3,278.1 L392.0,309.0 L417.2,326.7 L397.8,360.2 L369.9,347.3 L347.3,369.9 L360.2,397.8 L326.7,417.2 L309.0,392.0 L278.1,400.3 L275.3,430.9 L236.7,430.9 L233.9,400.3 L203.0,392.0 L185.3,417.2 L151.8,397.8 L164.7,369.9 L142.1,347.3 L114.2,360.2 L94.8,326.7 L120.0,309.0 L111.7,278.1 L81.1,275.3 L81.1,236.7 L111.7,233.9 L120.0,203.0 L94.8,185.3 L114.2,151.8 L142.1,164.7 L164.7,142.1 L151.8,114.2 L185.3,94.8 L203.0,120.0 Z" fill="url(#brass)" stroke="#5c3d0e" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="118" fill="#3a2a10" opacity="0.35"/>

  <!-- camera lens in the hub -->
  <circle cx="256" cy="256" r="108" fill="#1a1d24" stroke="#5c3d0e" stroke-width="6"/>
  <circle cx="256" cy="256" r="92" fill="#2c313b"/>
  <circle cx="256" cy="256" r="76" fill="url(#glass)"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#0a0d14" stroke-width="5"/>
  <circle cx="256" cy="256" r="34" fill="#071224"/>
  <!-- glints -->
  <ellipse cx="226" cy="222" rx="22" ry="13" transform="rotate(-35 226 222)" fill="#ffffff" opacity="0.75"/>
  <circle cx="290" cy="286" r="7" fill="#ffffff" opacity="0.45"/>
</svg>
