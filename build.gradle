// Create Cinematic Interactions (Forge 1.20.1).   ./gradlew build -> build/libs/createcinematic-<version>.jar (reobfuscated to SRG)
// Create and Cinematic Interactions are compile dependencies only; neither is bundled.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.tterrag.com' } // Registrate
    // the host jar in a hand-made maven layout (libs/local/<name>/<version>/<name>-<version>.jar): flatDir jars skip remapping
    maven {
        url = file('libs')
        metadataSources { artifact() }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run-client') // apart from run/, so a dev client and server can run side by side
            // ./gradlew runClient -PtestServer : joins the dev server (./gradlew runServer) straight away
            if (project.hasProperty('testServer')) {
                programArguments.addAll('--width', '1280', '--height', '720', '--quickPlayMultiplayer', '127.0.0.1:25565')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation "local:cinematic:${cinematic_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            cinematic_version_range: cinematic_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Forge 1.20.1 finds mixin configs and the mod version (${file.jarVersion} in mods.toml) in the jar manifest
jar {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json", 'Implementation-Version': project.version)
}
