mod_description=First-person Cinematic Interactions scenes for Create's workstations and hand-worked blocks: toolboxes, schematic table, schematicannon, frogports, postboxes, the redstone requester, and mouse-driven hand crank, valve handles, analog lever, desk bell and a CVT cutaway for the rotation speed controller.
